name: 功能建议
description: 想要新能力，或觉得哪里不好用
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: need
    attributes:
      label: 你想解决什么问题
      description: 先说场景，再说方案——避免我们讨论成两个不同的东西
      placeholder: 例如：我一次要处理 10 个视频，现在只能一个一个拖
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: 你希望它怎么工作
      placeholder: 例如：支持一次拖多个，排队依次处理，完成后打包下载

  - type: dropdown
    id: area
    attributes:
      label: 相关部分
      options:
        - 界面 / 交互
        - 语音识别
        - 翻译质量 / 术语表
        - 字幕输出 / 烧录
        - 安装与运行
        - 其他
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已经搜过 issue，没有重复
          required: true
