name: Bug 报告
description: 出错了、跑不起来、结果不对
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请尽量把下面填完整，尤其是**运行日志**和**你的环境**——
        这两项决定了能不能定位问题。

  - type: textarea
    id: what
    attributes:
      label: 发生了什么
      description: 你期望的结果 vs 实际结果
      placeholder: 例如：点「开始翻译」后进度停在语音识别，日志里出现 xxx
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 双击 run.bat
        2. 拖入 xxx.mp4
        3. ...
    validations:
      required: true

  - type: textarea
    id: log
    attributes:
      label: 运行日志 / 报错原文
      description: 页面底部「运行日志」里的内容，或命令行窗口的文字
      render: text
    validations:
      required: true

  - type: input
    id: env
    attributes:
      label: 环境
      description: 系统、Python 版本、有没有独显
      placeholder: Windows 11 / Python 3.12.10 / RTX 5060 Ti
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: 怎么启动的
      options:
        - 双击 run.bat
        - python app.py serve
        - 直接双击 vidtrans/web/index.html（这样不行，会连不上后端）
        - 命令行 python app.py run
        - 其他
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: vidtrans 版本
      description: 页面右上角，或 `python app.py --version`
      placeholder: v1.0.0

  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已经搜过 issue，没有重复
          required: true
        - label: 我把 API Key 之类的敏感信息删掉了
          required: true
