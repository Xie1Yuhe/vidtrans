<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>vidtrans · 视频字幕翻译</title>
<style>
  :root{
    --bg:#0d0f14; --panel:#151922; --panel2:#1b212c; --line:#252c39;
    --fg:#e7eaf0; --dim:#8b95a7; --gold:#c9a227; --ok:#3fb950; --err:#f85149;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
       font:14px/1.6 "Segoe UI","Microsoft YaHei",system-ui,sans-serif}
  .wrap{max-width:980px;margin:0 auto;padding:28px 20px 60px}
  header{display:flex;align-items:baseline;gap:12px;margin-bottom:6px}
  h1{font-size:22px;margin:0;letter-spacing:.5px}
  .ver{color:var(--dim);font-size:12px}
  .sub{color:var(--dim);margin:0 0 20px;font-size:13px}
  .badges{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
  .badge{font-size:12px;padding:3px 10px;border-radius:20px;
         border:1px solid var(--line);background:var(--panel);color:var(--dim)}
  .badge.ok{color:var(--ok);border-color:#20402a}
  .badge.err{color:var(--err);border-color:#4a2222}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
        padding:18px;margin-bottom:16px}
  .card h2{font-size:14px;margin:0 0 14px;color:var(--gold);font-weight:600;
           letter-spacing:.6px}
  #drop{border:2px dashed var(--line);border-radius:12px;padding:38px 20px;
        text-align:center;cursor:pointer;transition:.15s;background:var(--panel)}
  #drop:hover,#drop.hot{border-color:var(--gold);background:#1a1e27}
  #drop .big{font-size:15px;margin-bottom:6px}
  #drop .hint{color:var(--dim);font-size:12px}
  .row{display:flex;gap:14px;flex-wrap:wrap}
  .field{flex:1;min-width:180px}
  label{display:block;font-size:12px;color:var(--dim);margin-bottom:5px}
  input,select,textarea{width:100%;background:var(--panel2);border:1px solid var(--line);
        color:var(--fg);border-radius:8px;padding:9px 11px;font:inherit;outline:none}
  input:focus,select:focus,textarea:focus{border-color:#3d4757}
  textarea{resize:vertical;font-family:inherit}
  .mono{font-family:Consolas,monospace;font-size:12.5px}
  button{background:var(--panel2);border:1px solid var(--line);color:var(--fg);
         border-radius:8px;padding:9px 18px;font:inherit;cursor:pointer;transition:.15s}
  button:hover:not(:disabled){border-color:#465062}
  button.primary{background:var(--gold);border-color:var(--gold);color:#1a1405;
                 font-weight:600}
  button.primary:hover:not(:disabled){filter:brightness(1.1)}
  button:disabled{opacity:.45;cursor:not-allowed}
  .actions{display:flex;gap:10px;align-items:center;margin-top:4px;flex-wrap:wrap}
  .file-info{font-size:13px;color:var(--dim);margin-top:10px}
  .file-info b{color:var(--fg);font-weight:500}
  .stages{display:flex;flex-direction:column;gap:9px}
  .stage{display:grid;grid-template-columns:104px 1fr 74px;align-items:center;gap:12px}
  .stage .name{font-size:12.5px;color:var(--dim)}
  .stage.active .name{color:var(--fg)}
  .stage.done .name{color:var(--ok)}
  .bar{height:7px;background:var(--panel2);border-radius:5px;overflow:hidden}
  .bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,#8a6f14,var(--gold));
         transition:width .25s}
  .stage.done .bar>i{background:var(--ok)}
  .pct{font-size:12px;color:var(--dim);text-align:right;font-variant-numeric:tabular-nums}
  #log{height:190px;overflow:auto;background:#0a0c11;border:1px solid var(--line);
       border-radius:8px;padding:10px 12px;font:12.5px/1.65 Consolas,monospace;
       color:#9aa4b4;white-space:pre-wrap}
  #log .e{color:var(--err)}
  #log .g{color:var(--ok)}
  .dl{display:flex;gap:10px;flex-wrap:wrap}
  a.dlbtn{display:inline-block;padding:9px 18px;border-radius:8px;text-decoration:none;
          background:var(--gold);color:#1a1405;font-weight:600}
  a.dlbtn.alt{background:var(--panel2);color:var(--fg);border:1px solid var(--line);font-weight:400}
  .hidden{display:none!important}
  .tip{font-size:12px;color:var(--dim);margin-top:8px}
  details summary{cursor:pointer;color:var(--dim);font-size:13px;outline:none}
  details[open] summary{margin-bottom:12px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  #banner{border:1px solid #4a2222;background:#2a1414;color:#ffb4b0;
          border-radius:10px;padding:12px 16px;margin-bottom:18px;font-size:13px;
          line-height:1.7}
  #banner b{color:#ffd7d5}
  @media(max-width:680px){.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>vidtrans</h1><span class="ver" id="ver"></span>
  </header>
  <p class="sub">长视频字幕翻译 · 抽音频 → 语音识别 → 分块翻译 → 生成字幕 → 可选烧录</p>

  <div id="banner" class="hidden"></div>
  <div class="badges" id="badges"></div>

  <div class="card">
    <h2>① 选择视频</h2>
    <div id="drop">
      <div class="big">把视频拖到这里（拖到页面任何位置都行），或点击选择</div>
      <div class="hint">支持 mp4 / mkv / mov / avi / webm 等，几百 MB 到几 GB 都行</div>
    </div>
    <input type="file" id="file" class="hidden" accept="video/*,.mkv,.ts,.flv,.wmv">
    <div class="file-info" id="fileinfo"></div>
  </div>

  <div class="card">
    <h2>② 翻译设置</h2>
    <div class="grid2">
      <div class="field">
        <label>源语言（视频里说的话）</label>
        <select id="src_lang"></select>
      </div>
      <div class="field">
        <label>目标语言（字幕语言）</label>
        <select id="dst_lang"></select>
      </div>
    </div>
    <div class="row" style="margin-top:14px">
      <div class="field">
        <label>识别模型</label>
        <select id="asr_model">
          <option value="large-v3">large-v3（最准，推荐）</option>
          <option value="large-v2">large-v2</option>
          <option value="medium">medium（快）</option>
          <option value="small">small（更快，精度低）</option>
        </select>
      </div>
      <div class="field">
        <label>识别提示词（专有名词，提升准确率）</label>
        <input id="asr_prompt" placeholder="如：角色名、术语，用顿号分隔">
      </div>
    </div>
    <div class="row" style="margin-top:14px">
      <div class="field">
        <label>并发数</label>
        <input id="concurrency" type="number" min="1" max="16" value="6">
      </div>
      <div class="field">
        <label>每块字幕条数</label>
        <input id="chunk_size" type="number" min="20" max="300" value="120">
      </div>
      <div class="field">
        <label>烧录</label>
        <select id="burn">
          <option value="false">只出字幕文件</option>
          <option value="true">同时输出带字幕的视频</option>
        </select>
      </div>
    </div>

    <details style="margin-top:16px">
      <summary>术语表（推荐填写，决定译名一致性）</summary>
      <textarea id="glossary" rows="7" class="mono"
        placeholder="每行一条，用 → 或 = 分隔，例如：
廻珠 → 回珠
廻想残滓 → 回想残滓
ゾーン → ZONE（不是「领域」）"></textarea>
    </details>
    <details style="margin-top:10px">
      <summary>额外翻译要求</summary>
      <textarea id="extra_rules" rows="4"
        placeholder="例如：口语化，像中文直播口播；数字用阿拉伯数字；保留「」括起卡名"></textarea>
    </details>
  </div>

  <div class="card">
    <h2>③ 翻译接口</h2>
    <div class="grid2">
      <div class="field">
        <label>API 地址（OpenAI 兼容）</label>
        <input id="base_url" class="mono" placeholder="https://api.deepseek.com/v1">
      </div>
      <div class="field">
        <label>模型名</label>
        <input id="model_name" class="mono" placeholder="deepseek-chat">
      </div>
    </div>
    <div class="field" style="margin-top:14px">
      <label>API Key（只存在本机 ~/.vidtrans/config.json）</label>
      <input id="api_key" type="password" class="mono" placeholder="sk-...">
    </div>
    <div class="actions" style="margin-top:14px">
      <button id="savecfg">保存设置</button>
      <span class="tip" id="cfgtip"></span>
    </div>
  </div>

  <div class="card">
    <h2>④ 开始</h2>
    <div class="actions">
      <button id="start" class="primary" disabled>开始翻译</button>
      <button id="cancel" disabled>取消</button>
      <span class="tip" id="runtip"></span>
    </div>
    <div class="stages" id="stages" style="margin-top:18px"></div>
  </div>

  <div class="card hidden" id="resultcard">
    <h2>⑤ 结果</h2>
    <div class="dl" id="downloads"></div>
    <div class="tip" id="restip"></div>
  </div>

  <div class="card">
    <h2>日志</h2>
    <div id="log"></div>
  </div>
</div>

<script>
"use strict";
/* ---------- 0. 最优先：阻止浏览器「打开拖进来的文件」 ---------- */
(function () {
  ["dragenter", "dragover", "dragleave", "drop"].forEach(function (t) {
    window.addEventListener(t, function (e) { e.preventDefault(); }, false);
  });
})();

var LANG_FALLBACK = {
  ja: "日语", en: "英语", ko: "韩语", zh: "中文", "zh-tw": "繁体中文",
  ru: "俄语", fr: "法语", de: "德语", es: "西班牙语", pt: "葡萄牙语",
  it: "意大利语", th: "泰语", vi: "越南语"
};
var STAGES = [
  ["probe", "读取信息"], ["audio", "提取音轨"], ["asr", "语音识别"],
  ["split", "切分字幕"], ["translate", "翻译"], ["subtitle", "生成字幕"],
  ["burn", "烧录"]
];
var JOB = null, ES = null, ENV = null, FILE = null;

function $(s) { return document.querySelector(s); }
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>]/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c];
  });
}
function human(n) {
  if (n < 1024) return n + " B";
  if (n < 1048576) return (n / 1024).toFixed(1) + " KB";
  if (n < 1073741824) return (n / 1048576).toFixed(1) + " MB";
  return (n / 1073741824).toFixed(2) + " GB";
}
function log(msg, cls) {
  var el = $("#log");
  if (!el) return;
  var d = document.createElement("div");
  if (cls) d.className = cls;
  d.textContent = msg;
  el.appendChild(d);
  el.scrollTop = el.scrollHeight;
}
function banner(html) {
  var b = $("#banner");
  if (!b) return;
  b.innerHTML = html;
  b.classList.remove("hidden");
}
function setVal(id, v) {
  var el = document.getElementById(id);
  if (el) el.value = v;
}

/* ---------- 1. 立即构建 UI（不依赖网络） ---------- */
function buildStages() {
  $("#stages").innerHTML = STAGES.map(function (s) {
    return '<div class="stage" data-k="' + s[0] + '">' +
           '<div class="name">' + s[1] + '</div>' +
           '<div class="bar"><i></i></div><div class="pct"></div></div>';
  }).join("");
}
function fillLangs(langs) {
  var map = (langs && Object.keys(langs).length) ? langs : LANG_FALLBACK;
  var opts = Object.keys(map).map(function (k) {
    return '<option value="' + esc(k) + '">' + esc(map[k]) + " " + esc(k) + "</option>";
  }).join("");
  ["src_lang", "dst_lang"].forEach(function (id) {
    var el = document.getElementById(id);
    if (el) { el.innerHTML = opts; }
  });
  setVal("src_lang", "ja");
  setVal("dst_lang", "zh");
}
function setStage(k, frac, cls) {
  var el = document.querySelector('.stage[data-k="' + k + '"]');
  if (!el) return;
  if (cls) el.classList.add(cls);
  if (frac != null) {
    el.querySelector("i").style.width = (frac * 100).toFixed(1) + "%";
    el.querySelector(".pct").textContent = (frac * 100).toFixed(0) + "%";
  }
}
function resetStages() {
  Array.prototype.forEach.call(document.querySelectorAll(".stage"), function (e) {
    e.className = "stage";
    e.querySelector("i").style.width = "0";
    e.querySelector(".pct").textContent = "";
  });
}

/* ---------- 2. 文件选择 / 拖拽（最早绑定） ---------- */
function bindFilePicking() {
  var drop = $("#drop"), input = $("#file");
  if (drop && input) {
    drop.addEventListener("click", function () { input.click(); });
    input.addEventListener("change", function () {
      if (input.files && input.files[0]) pickFile(input.files[0]);
    });
  }
  ["dragenter", "dragover"].forEach(function (t) {
    window.addEventListener(t, function () {
      if (drop) drop.classList.add("hot");
    }, false);
  });
  ["dragleave", "dragend"].forEach(function (t) {
    window.addEventListener(t, function () {
      if (drop) drop.classList.remove("hot");
    }, false);
  });
  window.addEventListener("drop", function (e) {
    if (drop) drop.classList.remove("hot");
    var dt = e.dataTransfer;
    if (!dt) return;
    var f = (dt.files && dt.files[0]);
    if (!f && dt.items && dt.items.length) {
      for (var i = 0; i < dt.items.length; i++) {
        if (dt.items[i].kind === "file") { f = dt.items[i].getAsFile(); break; }
      }
    }
    if (f) pickFile(f);
  }, false);
}

function pickFile(file) {
  if (!file) return;
  FILE = file;
  $("#fileinfo").innerHTML = "<b>" + esc(file.name) + "</b> · " +
    human(file.size) + " · 准备上传…";
  doUpload(file);
}

function doUpload(file) {
  var startBtn = $("#start");
  if (startBtn) startBtn.disabled = true;
  log("开始上传：" + file.name);
  var xhr = new XMLHttpRequest();
  xhr.open("POST", "/api/upload", true);
  xhr.setRequestHeader("X-Filename", encodeURIComponent(file.name));
  xhr.upload.onprogress = function (e) {
    if (e.lengthComputable) {
      $("#fileinfo").innerHTML = "<b>" + esc(file.name) + "</b> · " +
        human(e.loaded) + " / " + human(e.total) + " 上传中…";
    }
  };
  xhr.onload = function () {
    var j;
    try { j = JSON.parse(xhr.responseText); }
    catch (err) {
      log("上传失败：返回不是 JSON（服务没启动？）", "e"); return;
    }
    if (!j.ok) { log("上传失败：" + (j.error || "未知错误"), "e"); return; }
    JOB = j.job;
    $("#fileinfo").innerHTML = "<b>" + esc(j.filename) + "</b> · " +
      human(j.size) + " · 已就绪";
    if (startBtn) startBtn.disabled = false;
    log("上传完成，可以开始翻译");
  };
  xhr.onerror = function () {
    log("上传失败：连不上本地服务。请确认是用 run.bat 启动、并通过 http://127.0.0.1:8765/ 打开本页", "e");
  };
  xhr.send(file);
}

/* ---------- 3. 与后端通信 ---------- */
function apiGet(path) {
  return fetch(path, { cache: "no-store" }).then(function (r) {
    if (!r.ok) throw new Error("HTTP " + r.status);
    return r.json();
  });
}
function apiPost(path, obj) {
  return fetch(path, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(obj || {})
  }).then(function (r) { return r.json(); });
}

function loadEnv() {
  return apiGet("/api/env").then(function (env) {
    ENV = env;
    $("#ver").textContent = "v" + env.version;
    var b = [];
    b.push(env.ffmpeg_ok
      ? '<span class="badge ok">ffmpeg 就绪</span>'
      : '<span class="badge err">找不到 ffmpeg</span>');
    b.push(env.faster_whisper
      ? '<span class="badge ok">识别引擎就绪</span>'
      : '<span class="badge err">缺少 faster-whisper</span>');
    b.push(env.gpu
      ? '<span class="badge ok">GPU 可用</span>'
      : '<span class="badge">CPU 模式</span>');
    if (env.cuda_libs_missing && env.cuda_libs_missing.length) {
      b.push('<span class="badge err">缺 CUDA 库：' + esc(env.cuda_libs_missing.join(", ")) + "</span>");
    }
    $("#badges").innerHTML = b.join("");
    if (!env.ffmpeg_ok) {
      log("找不到 ffmpeg：放到本目录 bin\\ 下，或设置环境变量 VIDTRANS_FFMPEG 指向含 ffmpeg.exe 的目录，然后重启", "e");
    }
    fillLangs(env.langs);
  });
}

function loadConfig() {
  return apiGet("/api/config").then(function (c) {
    setVal("src_lang", c.src_lang || "ja");
    setVal("dst_lang", c.dst_lang || "zh");
    setVal("asr_model", c.asr_model || "large-v3");
    setVal("asr_prompt", c.asr_prompt || "");
    setVal("concurrency", c.concurrency || 6);
    setVal("chunk_size", c.chunk_size || 120);
    setVal("burn", String(!!c.burn));
    setVal("glossary", c.glossary || "");
    setVal("extra_rules", c.extra_rules || "");
    var p = c.provider || {};
    setVal("base_url", p.base_url || "");
    setVal("model_name", p.model || "");
    setVal("api_key", p.api_key || "");
  });
}

function collectOptions() {
  return {
    src_lang: $("#src_lang").value,
    dst_lang: $("#dst_lang").value,
    asr_model: $("#asr_model").value,
    asr_prompt: $("#asr_prompt").value,
    concurrency: +$("#concurrency").value || 6,
    chunk_size: +$("#chunk_size").value || 120,
    burn: $("#burn").value === "true",
    glossary: $("#glossary").value,
    extra_rules: $("#extra_rules").value,
    provider: {
      base_url: $("#base_url").value.trim(),
      model: $("#model_name").value.trim(),
      api_key: $("#api_key").value.trim()
    }
  };
}

function saveConfig() {
  var body = collectOptions();
  apiPost("/api/config", body).then(function (r) {
    $("#cfgtip").textContent = r.ok ? "已保存" : "保存失败";
    setTimeout(function () { $("#cfgtip").textContent = ""; }, 2500);
  }).catch(function () { $("#cfgtip").textContent = "保存失败（服务未连接）"; });
}

/* ---------- 4. 运行与进度 ---------- */
function startJob() {
  if (!JOB) { log("还没有上传视频", "e"); return; }
  resetStages();
  $("#resultcard").classList.add("hidden");
  $("#start").disabled = true;
  $("#cancel").disabled = false;
  saveConfig();
  apiPost("/api/start", { job: JOB, options: collectOptions() }).then(function (j) {
    if (!j.ok) {
      log("启动失败：" + j.error, "e");
      $("#start").disabled = false;
      $("#cancel").disabled = true;
      return;
    }
    listen();
  }).catch(function (e) {
    log("启动失败：" + e.message, "e");
    $("#start").disabled = false;
    $("#cancel").disabled = true;
  });
}

function listen() {
  if (ES) ES.close();
  ES = new EventSource("/api/events?job=" + encodeURIComponent(JOB));
  ES.onmessage = function (m) {
    var ev = JSON.parse(m.data);
    if (ev.type === "stage") {
      var idx = STAGES.findIndex(function (s) { return s[0] === ev.stage; });
      STAGES.forEach(function (s, i) { if (i < idx) setStage(s[0], 1, "done"); });
      setStage(ev.stage, null, "active");
    } else if (ev.type === "progress") {
      setStage(ev.stage, ev.frac);
    } else if (ev.type === "log") {
      log(String(ev.msg || ""), /失败|错误|取消/.test(String(ev.msg)) ? "e" : "");
    } else if (ev.type === "done") {
      STAGES.forEach(function (s) { setStage(s[0], 1, "done"); });
      showResult(ev.result);
      $("#start").disabled = false;
      $("#cancel").disabled = true;
      ES.close();
    } else if (ev.type === "error") {
      log("出错：" + ev.msg, "e");
      $("#start").disabled = false;
      $("#cancel").disabled = true;
      ES.close();
    }
  };
  ES.onerror = function () { log("进度连接中断", "e"); };
}

function showResult(res) {
  var f = res.files || {};
  function mk(name, text, alt) {
    if (!f[name]) return "";
    return '<a class="dlbtn ' + (alt ? "alt" : "") + '" href="/api/result?job=' +
      encodeURIComponent(JOB) + "&name=" + name + '">' + text + "</a>";
  }
  $("#downloads").innerHTML =
    mk("srt", "下载中文字幕 .srt") + mk("bilingual", "下载双语 .srt", 1) +
    mk("ass", "下载 .ass（带样式）", 1) + mk("mp4", "下载带字幕视频 .mp4", 1);
  $("#restip").textContent = "共 " + res.cues + " 条字幕 · 视频时长 " +
    Math.round(res.duration / 60) + " 分钟 · 耗时 " + Math.round(res.elapsed) + " 秒";
  $("#resultcard").classList.remove("hidden");
  log("完成：" + res.cues + " 条字幕，用时 " + Math.round(res.elapsed) + " 秒", "g");
}

/* ---------- 5. 启动 ---------- */
function boot() {
  buildStages();
  fillLangs(LANG_FALLBACK);      // 先用内置语言表，保证下拉可用
  bindFilePicking();             // 先绑定拖拽/选择，再谈联网

  $("#savecfg").addEventListener("click", saveConfig);
  $("#start").addEventListener("click", startJob);
  $("#cancel").addEventListener("click", function () {
    if (JOB) fetch("/api/cancel?job=" + encodeURIComponent(JOB), { method: "POST" });
  });

  if (location.protocol === "file:") {
    banner("<b>这个页面不能直接双击打开。</b><br>" +
      "请先运行 <b>run.bat</b>（或 <b>python app.py</b>），" +
      "然后在浏览器访问 <b>http://127.0.0.1:8765/</b>。");
    log("当前是 file:// 协议，无法连接后端服务", "e");
    return;
  }

  loadEnv().then(loadConfig).catch(function (e) {
    banner("<b>连不上本地后端。</b><br>" +
      "请确认 vidtrans 正在运行（命令行窗口没关），" +
      "并访问 <b>http://127.0.0.1:8765/</b>。<br>错误：" + esc(e.message));
    log("初始化失败：" + e.message, "e");
  });
}

if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", boot);
} else {
  boot();
}
</script>
</body>
</html>
